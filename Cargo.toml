[workspace]
members = [ "crates/*" ]
# Patched upstream crates; see vendor/README.md.
exclude = [ "vendor" ]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

# masonry 0.4.0 with vendor/masonry.patch applied; see vendor/README.md.
[patch.crates-io]
masonry = { path = "vendor/masonry" }
